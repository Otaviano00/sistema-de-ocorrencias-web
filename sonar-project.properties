# SonarQube / SonarCloud — Web (Angular)
# Host e token vêm do ambiente: SONAR_HOST_URL e SONAR_TOKEN.
sonar.projectKey=sistema-de-ocorrencias-web
sonar.projectName=Sistema de Ocorrencias - Web
# sonar.organization=<org>   # obrigatório apenas no SonarCloud
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.exclusions=**/*.spec.ts
sonar.test.inclusions=**/*.spec.ts
sonar.coverage.exclusions=src/main.ts,src/**/*.config.ts,src/**/*.routes.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.spec.json
